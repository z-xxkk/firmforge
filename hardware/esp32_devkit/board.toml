# 经典 ESP32 开发板（ESP32-DevKitC 一类，模组型号待实测确认）。
# 引出引脚按 38 针 DevKitC 的常见排布；保留引脚以 profile.json 为准（出处为 ESP32 数据手册 v5.3）。
name = "ESP32 DevKit"
chip = "esp32"
exposed = [0, 1, 2, 3, 4, 5, 12, 13, 14, 15, 16, 17, 18, 19, 21, 22, 23, 25, 26, 27, 32, 33, 34, 35, 36, 39]
# 分配顺序：先用没有特殊功能的引脚；JTAG 用的 GPIO13/14 排在后面
prefer = [21, 22, 4, 27, 25, 26, 17, 16, 18, 19, 23, 32, 33, 13, 14]
