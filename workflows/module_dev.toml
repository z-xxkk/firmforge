# 工作流 module_dev 1.0.1。由 FirmForge 设计器保存；也可以手改，设计器打开时会照着画。
name = "module_dev"
version = "1.0.1"
based_on = "1.0.0"

[[main]]
id = "plan"
kind = "agent"
role = "planner"

[[main]]
id = "confirm_plan"
kind = "human"
enabled_by = "human_review"

[[main]]
id = "modules"
kind = "foreach"
over = "plan.modules"
subflow = "module_impl"

[[main]]
id = "integrate"
kind = "verify"
scope = "all"

[[subflow.module_impl.steps]]
id = "write"
kind = "parallel"
branches = ["code", "test"]

[[subflow.module_impl.steps]]
id = "code"
kind = "agent"
role = "coder"

[[subflow.module_impl.steps]]
id = "test"
kind = "agent"
role = "tester"

[[subflow.module_impl.steps]]
id = "check"
kind = "verify"
scope = "module"

[[subflow.module_impl.steps]]
id = "repair"
kind = "loop"
until = "verify_passed"
body = "repair_round"
max = "loop.max_attempts_per_module"

[[subflow.module_impl.steps]]
id = "review_gate"
kind = "condition"
if = "verify_passed"
then = ["review"]

[[subflow.module_impl.steps]]
id = "review"
kind = "agent"
role = "reviewer"
