# 模块开发工作流模板（ARCHITECTURE §2.7）。具体拆成哪些模块由规划 Agent 在运行时决定。
name = "module_dev"
version = "1.0.0"

[[main]]
id = "plan"
kind = "agent"
role = "planner"

[[main]]
id = "confirm_plan"
kind = "human"                    # 只有开启 human_review 时才停下等待确认
enabled_by = "human_review"

[[main]]
id = "modules"
kind = "foreach"                  # 对规划出的每个模块实例化子流程，按依赖并行
over = "plan.modules"
subflow = "module_impl"

[[main]]
id = "integrate"
kind = "verify"
scope = "all"

# 子流程：每个模块一份。编码与写测试并行；判定没过进入修正循环；通过后审查（只作提示）
[[subflow.module_impl.steps]]
id = "write"
kind = "parallel"
branches = ["code", "test"]

[[subflow.module_impl.steps]]
id = "code"
kind = "agent"
role = "coder"

[[subflow.module_impl.steps]]
id = "test"
kind = "agent"
role = "tester"

[[subflow.module_impl.steps]]
id = "check"
kind = "verify"
scope = "module"

[[subflow.module_impl.steps]]
id = "repair"
kind = "loop"
until = "verify_passed"
body = "repair_round"             # 诊断 → 按责任交给编码或测试 Agent → 再判定；变差则回滚
max = "loop.max_attempts_per_module"

[[subflow.module_impl.steps]]
id = "review_gate"
kind = "condition"
if = "verify_passed"
then = ["review"]

[[subflow.module_impl.steps]]
id = "review"
kind = "agent"
role = "reviewer"                 # 只作提示，最多触发 1 次额外修改，不能否决通过
