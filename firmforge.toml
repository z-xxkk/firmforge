# FirmForge 全局配置（ARCHITECTURE §2.6）

[llm]
api_key_env = "DEEPSEEK_API_KEY"
base_url_env = "DEEPSEEK_BASE_URL"
timeout_s = 600                   # 思考模式回复较慢
max_retries = 3

# 价格来源：DeepSeek 官网价目表（2026-10-24 由负责人提供），元 / 百万 token，输入按缓存未命中
[pricing]
utc_offset_hours = 8                            # 按北京时间判断
peak_hours = ["09:00-12:00", "14:00-18:00"]     # 工作日高峰；其余时段和周末为空闲

[models.fast]                     # 型号以 `firmforge models` 列出的为准
name = "deepseek-flash"
thinking = true                   # 思考模式
max_tokens = 65536                # 单次输出上限（含思考内容）
price_in_per_mtok = 2.0           # 高峰
price_out_per_mtok = 8.0
price_in_offpeak_per_mtok = 1.0   # 空闲
price_out_offpeak_per_mtok = 4.0

[models.strong]
name = "deepseek-v4-pro"
thinking = true
max_tokens = 65536
price_in_per_mtok = 9.0
price_out_per_mtok = 27.0
price_in_offpeak_per_mtok = 4.5
price_out_offpeak_per_mtok = 13.5

[concurrency]
llm = 4                           # 同时进行的 LLM 调用数
verify = 4                        # 同时进行的判定数

[loop]
max_attempts_per_module = 6
rounds_before_escalation = 3
repeat_threshold = 2              # 同一签名连续出现几次就升级

[scheduler]
alpha = 0.3                       # 成本权重
beta = 0.2                        # 负载权重
gamma = 0.5                       # 探索权重
seed = 42

# 工具（DECISIONS 第 63 条，tasks_inbox/tools_mcp_framework.md）
[tools]
max_rounds = 5                    # 一次生成最多几轮工具往返
max_chars = 8000                  # 每次工具结果最多几个字符，超出截断、完整内容存到运行目录 tool_outputs/

# 外部 MCP 服务（只支持本机 stdio）。默认关闭；评测时一律不用。
# 新服务第一次启用要在桌面软件里确认；ask = true 表示每次调用前都问你。
[mcp.servers.fetch]
command = "uvx"
args = ["mcp-server-fetch"]
enabled = false
ask = true
timeout_s = 60
