id = "w25q_drv"
title = "W25Q64 SPI Flash 驱动"
category = "driver"
difficulty = 3
source = "Winbond《W25Q64JV 数据手册》Revision J（2018-03-27）：指令码、跨页回绕、写使能自动清除、忙时忽略指令（tasks_inbox/batch3_rules.md）"

[budget]
# 参考实现实测：flash 482、ram 0、调用链最坏栈 320（write 的 260 字节页编程缓冲 + wait_ready；不含 hal_spi 实现）；按 2 倍定（DECISIONS 第 19、20、27 条）
flash_bytes = 964
ram_bytes = 0
stack_bytes = 640

[rules]
extra_forbidden_symbols = []
allowed_symbols = []

[[mutants]]
file = "mutants/no_page_split.c"
replaces = "w25q.c"
expect_fail = "hidden_tests"
why = "不按页拆分，跨页数据被芯片回绕到本页开头覆盖"

[[mutants]]
file = "mutants/single_write_enable.c"
replaces = "w25q.c"
expect_fail = "hidden_tests"
why = "只在开头发一次写使能，第二页起写不进去（写使能在编程后自动清除）"

[[mutants]]
file = "mutants/no_busy_wait.c"
replaces = "w25q.c"
expect_fail = "hidden_tests"
why = "不等忙标志就发下一条指令，芯片忙时会忽略它"

[[mutants]]
file = "mutants/addr_little_endian.c"
replaces = "w25q.c"
expect_fail = "hidden_tests"
why = "24 位地址低字节在前（手册规定 A23–A16 先发）"
